<text x="530" y="120" font-family="Vazirmatn, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13.2" font-weight="500" fill="#1F2B3D">Built mobile apps in DEPI Round 4 and backend APIs in</text><text x="530" y="140" font-family="Vazirmatn, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13.2" font-weight="500" fill="#1F2B3D">IEEE—learning how interfaces, databases, auth, and business</text><text x="530" y="160" font-family="Vazirmatn, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13.2" font-weight="500" fill="#1F2B3D">logic connect across a full system.</text>
