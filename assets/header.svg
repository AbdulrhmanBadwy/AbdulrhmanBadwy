  <pattern id="dotsNavy" width="9" height="9" patternUnits="userSpaceOnUse">
    <circle cx="4.5" cy="4.5" r="1.5" fill="#001A30"/>
  </pattern>
  <filter id="shadow" x="-8%" y="-15%" width="116%" height="140%">
    <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.15"/>
  </filter>
</defs>
<rect width="1200" height="390" fill="#F4EDE5"/>
<rect width="1200" height="390" fill="url(#dots)"/>
