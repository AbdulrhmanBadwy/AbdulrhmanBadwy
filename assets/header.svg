      font-weight="800" fill="#001A30" letter-spacing="1.2">CS STUDENT · EGYPT</text>

<!-- kicker -->
<text x="600.0" y="136" text-anchor="middle" font-family="Vazirmatn, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="800"
